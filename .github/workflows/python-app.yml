name: CloudLaunch Python validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run all backend unit tests (no AWS access)
        run: |
          python -m unittest discover -s tests -v
      - name: Verify Python syntax
        run: |
          python -m compileall -q cloudlaunch cloudlaunch_cd tests streamlit_app.py
